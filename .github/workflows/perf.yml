name: Performance

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Board load
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Provide a database URL for the production build
        run: cp .env.example .env

      - name: Measure the 500-issue board
        env:
          PERF_BOARD_LOAD_BUDGET_MS: "1200"
        run: npm run perf
